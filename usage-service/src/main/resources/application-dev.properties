spring.application.name=user-service
server.port=8083

api.prefix=api/v1

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

#Hide Swagger UI in production
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false

#kafka-consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.mapping=energyUsageEvent:com.selvam.kafka.event.EnergyUsageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

#spring.kafka.consumer.properties.spring.json.trusted.packages=*
#spring.kafka.consumer.properties.spring.json.value.default.type=com.selvam.rewardservice.entity.Transaction
#spring.kafka.consumer.properties.spring.json.use.type.headers=false
#spring.kafka.listener.missing-topics-fatal=false

#Influx DB Configuration
influx.url=http://localhost:8181
influx.token=${INFLUXDB_3_TOKEN}
influx.org=selvam
influx.bucket=usage-bucket
influx.database=usage-bucket

device.service.url=http://localhost:8081/api/v1/device
user.service.url=http://localhost:8080/api/v1/user

#Kafka - Producer
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

